name: "CodeQL Analysis"

on:
  push:
    branches: [ 1.20 ]
  pull_request:
    branches: [ 1.20 ]
  schedule:
    - cron: '0 0 * * 0'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [ java ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # fabric-loom 1.18.2 refuses to configure on older JVMs, which is what the
      # autobuild hit; the subproject toolchains still pick 17/21/25 themselves.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4