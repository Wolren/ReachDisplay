name: Release
on:
  push:
    tags:
      - 'v*'

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - subproject: version-1_17_1_18
            jdk: '21'
            loaders: fabric,quilt
            gameversions: 1.17.1,1.18,1.18.1,1.18.2
            cf_mode: direct
            cfdeps: |-
              fabric-api(required)
              midnightlib(required)
              modmenu(optional)
          - subproject: version-1_19
            jdk: '21'
            loaders: fabric,quilt
            gameversions: 1.19.1,1.19.2,1.19.3,1.19.4
            cf_mode: direct
            cfdeps: |-
              fabric-api(required)
              midnightlib(required)
              modmenu(optional)
          - subproject: version-1_20_1
            jdk: '21'
            loaders: fabric,quilt
            gameversions: 1.20.1,1.20.2,1.20.3,1.20.4,1.20.5,1.20.6
            cf_mode: direct
            cfdeps: |-
              fabric-api(required)
              midnightlib(required)
              modmenu(optional)
          - subproject: version-1_21_1
            jdk: '21'
            loaders: fabric,quilt
            gameversions: 1.21.1,1.21.2,1.21.3,1.21.4
            cf_mode: direct
            cfdeps: |-
              fabric-api(required)
              midnightlib(required)
              modmenu(optional)
          - subproject: version-1_21_5
            jdk: '21'
            loaders: fabric,quilt
            gameversions: 1.21.5
            cf_mode: direct
            cfdeps: |-
              fabric-api(required)
              midnightlib(required)
              modmenu(optional)
          - subproject: version-1_21_11
            jdk: '21'
            loaders: fabric,quilt
            gameversions: 1.21.6,1.21.7,1.21.8,1.21.9,1.21.10,1.21.11
            cf_mode: direct
            cfdeps: |-
              fabric-api(required)
              midnightlib(required)
              modmenu(optional)
          - subproject: version-26_1_2
            jdk: '25'
            loaders: fabric,quilt
            gameversions: 26.1,26.1.1,26.1.2
            cf_mode: direct
            cfdeps: |-
              fabric-api(required)
              midnightlib(required)
              modmenu(optional)
          - subproject: version-26_2
            jdk: '25'
            loaders: fabric,quilt
            gameversions: 26.2
            cf_mode: direct
            cfdeps: |-
              fabric-api(required)
              midnightlib(required)
              modmenu(optional)
          - subproject: version-1_21_1-neoforge
            jdk: '21'
            loaders: neoforge
            cf_mode: mcpublish
            cfdeps: |-
              midnightlib(required)
          - subproject: version-1_21_11-neoforge
            jdk: '21'
            loaders: neoforge
            cf_mode: mcpublish
            cfdeps: |-
              midnightlib(required)
          - subproject: version-26_2-neoforge
            jdk: '25'
            loaders: neoforge
            cf_mode: mcpublish
            cfdeps: |-
              midnightlib(required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.jdk }}
          distribution: 'temurin'
      - name: Isolate subproject in settings.gradle
        shell: bash
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven {
                      name = 'Fabric'
                      url = 'https://maven.fabricmc.net/'
                  }
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'ReachDisplay'
          include '${{ matrix.subproject }}'
          EOF
      - name: Build ${{ matrix.subproject }}
        run: |
          chmod +x gradlew
          ./gradlew :${{ matrix.subproject }}:build --no-daemon
      - name: Check if version exists on Modrinth
        id: check_modrinth
        run: |
          VERSION=$(grep 'mod_version' ${{ matrix.subproject }}/gradle.properties | cut -d= -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # The list endpoint ignores ?version_number - filter client-side.
          EXISTS=$(curl -s "https://api.modrinth.com/v2/project/reach-display/version" \
            | python3 -c "import json,sys; vs=json.load(sys.stdin); print(any(v['version_number']=='$VERSION' for v in vs))")
          if [ "$EXISTS" = "True" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Version $VERSION already exists on Modrinth, skipping"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Publish ${{ matrix.subproject }} to Modrinth
        if: steps.check_modrinth.outputs.exists == 'false'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          ./gradlew :${{ matrix.subproject }}:modrinth --no-daemon
      - name: Check CurseForge for existing files (idempotency guard)
        id: check_cf
        run: |
          VERSION=$(grep 'mod_version' ${{ matrix.subproject }}/gradle.properties | cut -d= -f2)
          FILES=$(curl -s "https://www.curseforge.com/api/v1/mods/991296/files?pageSize=50&sortBy=dateCreated&sortDescending=true")
          COUNT=$(echo "$FILES" | jq --arg v "$VERSION" '[.data[] | select(.displayName == $v)] | length')
          echo "cf_exists=$([ "$COUNT" -gt 0 ] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "cf_count=$COUNT" >> $GITHUB_OUTPUT
      - name: Publish ${{ matrix.subproject }} to CurseForge (direct API)
        if: steps.check_cf.outputs.cf_exists == 'false' && matrix.cf_mode == 'direct'
        env:
          CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CF_PROJECT: 991296
        run: |
          VERSION=$(grep 'mod_version' ${{ matrix.subproject }}/gradle.properties | cut -d= -f2)
          JAR=$(ls ${{ matrix.subproject }}/build/libs/reach_display-${VERSION}.jar | head -1)
          TYPES=$(curl -s -H "x-api-key: $CF_TOKEN" "https://api.curseforge.com/v1/game/version-types?cache=true")
          MC_TYPE=$(echo "$TYPES" | jq -r '.data[] | select(.name == "Minecraft") | .id')
          MAP=$(curl -s -H "x-api-key: $CF_TOKEN" "https://api.curseforge.com/v1/game/versions?cache=true")
          IDS=$(echo "$MAP" | jq -c --argjson t "$MC_TYPE" --arg gv "${{ matrix.gameversions }}" '[.data[] | select(.type == $t) | select(($gv | split(",")) | index(.name)) | .id]')
          echo "resolved game version ids: $IDS"
          METADATA=$(jq -n --arg v "$VERSION" --argjson ids "$IDS" --rawfile cl CHANGELOG.md \
            '{changelog: $cl, changelogType: "markdown", displayName: $v, gameVersions: $ids, releaseType: "release", relations: {projects: [{"slug": "fabric-api", "type": "requiredDependency"}, {"slug": "midnightlib", "type": "requiredDependency"}, {"slug": "modmenu", "type": "optionalDependency"}]}}')
          RESP=$(curl -s -X POST -H "x-api-key: $CF_TOKEN" -F "metadata=$METADATA" -F "file=@$JAR" "https://minecraft.curseforge.com/api/projects/$CF_PROJECT/upload-file")
          echo "$RESP" | head -c 400
          echo ""
          echo "$RESP" | jq -e '.id' >/dev/null || { echo "UPLOAD FAILED"; exit 1; }
      - name: Publish ${{ matrix.subproject }} to CurseForge (mc-publish)
        if: steps.check_cf.outputs.cf_exists == 'false' && matrix.cf_mode == 'mcpublish'
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075  # v3 — SHA-pinned (moving v3 tag silently changed CF game-version resolution 2026-08-10)
        with:
          curseforge-id: 991296
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-version: ${{ steps.check_modrinth.outputs.version }}
          files: ${{ matrix.subproject }}/build/libs/!(*-@(dev|sources|javadoc)).jar
          loaders: ${{ matrix.loaders }}
          game-versions: ${{ matrix.gameversions }}
          fail-mode: warn
          changelog-file: CHANGELOG.md
          curseforge-dependencies: ${{ matrix.cfdeps }}
      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.subproject }}
          path: ${{ matrix.subproject }}/build/libs/*.jar

  forge-1201:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build Forge 1.20.1 (standalone project)
        run: |
          cd version-1_20_1-forge
          chmod +x gradlew
          ./gradlew build --no-daemon -Dorg.gradle.java.home=$JAVA_HOME
      - name: Check if version exists on Modrinth
        id: check_modrinth
        run: |
          cd version-1_20_1-forge
          VERSION=$(grep 'mod_version' gradle.properties | cut -d= -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          EXISTS=$(curl -s "https://api.modrinth.com/v2/project/reach-display/version" \
            | python3 -c "import json,sys; vs=json.load(sys.stdin); print(any(v['version_number']=='$VERSION' for v in vs))")
          if [ "$EXISTS" = "True" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Version $VERSION already exists on Modrinth, skipping"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Publish Forge 1.20.1 to Modrinth
        if: steps.check_modrinth.outputs.exists == 'false'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          cd version-1_20_1-forge
          ./gradlew modrinth --no-daemon -Dorg.gradle.java.home=$JAVA_HOME
      - name: Check CurseForge for existing files (idempotency guard)
        id: check_cf
        run: |
          VERSION=$(grep 'mod_version' version-1_20_1-forge/gradle.properties | cut -d= -f2)
          FILES=$(curl -s "https://www.curseforge.com/api/v1/mods/991296/files?pageSize=50&sortBy=dateCreated&sortDescending=true")
          COUNT=$(echo "$FILES" | jq --arg v "$VERSION" '[.data[] | select(.displayName == $v)] | length')
          echo "cf_exists=$([ "$COUNT" -gt 0 ] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "cf_count=$COUNT" >> $GITHUB_OUTPUT
      - name: Publish Forge 1.20.1 to CurseForge
        if: steps.check_cf.outputs.cf_exists == 'false'
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075  # v3 — SHA-pinned (moving v3 tag silently changed CF game-version resolution 2026-08-10)
        with:
          curseforge-id: 991296
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-version: ${{ steps.check_modrinth.outputs.version }}
          files: version-1_20_1-forge/build/libs/!(*-@(dev|sources|javadoc)).jar
          loaders: forge
          fail-mode: warn
          changelog-file: CHANGELOG.md
          curseforge-dependencies: |-
            midnightlib(required)
      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: version-1_20_1-forge
          path: version-1_20_1-forge/build/libs/*.jar

  release:
    needs: [build, forge-1201]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Extract changelog
        run: |
          # First ## section body, CRLF-safe. (The old sed idiom never looped:
          # it printed only headers plus one line, so release notes were garbage.)
          python3 - <<'EOF'
          import pathlib
          lines = pathlib.Path('CHANGELOG.md').read_text().splitlines()
          out, seen = [], False
          for line in lines:
              if line.startswith('## '):
                  if seen:
                      break
                  seen = True
                  continue
              if seen:
                  out.append(line)
          pathlib.Path('/tmp/release-notes.md').write_text('\n'.join(out))
          EOF
      - name: Download all JARs
        uses: actions/download-artifact@v8
        with:
          path: jars
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file /tmp/release-notes.md \
            jars/*/*.jar
