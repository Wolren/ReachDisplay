name: Release
on:
  push:
    tags:
      - 'v*'

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - subproject: version-1_17_1_18
            jdk: '21'
          - subproject: version-1_19
            jdk: '21'
          - subproject: version-1_20_1
            jdk: '21'
          - subproject: version-1_21_1
            jdk: '21'
          - subproject: version-1_21_5
            jdk: '21'
          - subproject: version-1_21_11
            jdk: '21'
          - subproject: version-26_1_2
            jdk: '25'
          - subproject: version-26_2
            jdk: '25'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.jdk }}
          distribution: 'temurin'
      - name: Isolate subproject in settings.gradle
        shell: bash
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven {
                      name = 'Fabric'
                      url = 'https://maven.fabricmc.net/'
                  }
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'ReachDisplay'
          include '${{ matrix.subproject }}'
          EOF
      - name: Build ${{ matrix.subproject }}
        run: |
          chmod +x gradlew
          ./gradlew :${{ matrix.subproject }}:build --no-daemon
      - name: Check if version exists on Modrinth
        id: check_modrinth
        run: |
          VERSION=$(grep 'mod_version' ${{ matrix.subproject }}/gradle.properties | cut -d= -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # The list endpoint ignores ?version_number - filter client-side.
          EXISTS=$(curl -s "https://api.modrinth.com/v2/project/reach-display/version" \
            | python3 -c "import json,sys; vs=json.load(sys.stdin); print(any(v['version_number']=='$VERSION' for v in vs))")
          if [ "$EXISTS" = "True" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Version $VERSION already exists on Modrinth, skipping"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Publish ${{ matrix.subproject }} to Modrinth
        if: steps.check_modrinth.outputs.exists == 'false'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          ./gradlew :${{ matrix.subproject }}:modrinth --no-daemon
      - name: Publish ${{ matrix.subproject }} to CurseForge
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: 991296
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-version: ${{ steps.check_modrinth.outputs.version }}
          files: ${{ matrix.subproject }}/build/libs/!(*-@(dev|sources|javadoc)).jar
          loaders: fabric
          fail-mode: warn
          changelog-file: CHANGELOG.md
          curseforge-relations: |
            fabric-api:requiredDependency
            midnightlib:requiredDependency
            modmenu:optionalDependency
      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.subproject }}
          path: ${{ matrix.subproject }}/build/libs/*.jar

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract changelog
        run: |
          # First ## section body, CRLF-safe. (The old sed idiom never looped:
          # it printed only headers plus one line, so release notes were garbage.)
          python3 - <<'EOF'
          import pathlib
          lines = pathlib.Path('CHANGELOG.md').read_text().splitlines()
          out, seen = [], False
          for line in lines:
              if line.startswith('## '):
                  if seen:
                      break
                  seen = True
                  continue
              if seen:
                  out.append(line)
          pathlib.Path('/tmp/release-notes.md').write_text('\n'.join(out))
          EOF
      - name: Download all JARs
        uses: actions/download-artifact@v8
        with:
          path: jars
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file /tmp/release-notes.md \
            jars/*/*.jar
