name: Release
on:
  push:
    tags:
      - 'v*'

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        subproject:
          - version-1_17_1_18
          - version-1_19
          - version-1_20_1
          - version-1_21_11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build ${{ matrix.subproject }}
        run: |
          chmod +x gradlew
          ./gradlew :${{ matrix.subproject }}:build --no-daemon
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.subproject }}
          path: ${{ matrix.subproject }}/build/libs/*.jar

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract changelog
        run: |
          sed -n '/^## /{p; :a n; /^## /q; p;}' CHANGELOG.md \
            | head -n -1 | tail -n +2 > /tmp/release-notes.md
      - name: Download all JARs
        uses: actions/download-artifact@v4
        with:
          path: jars
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file /tmp/release-notes.md \
            jars/*/*.jar
