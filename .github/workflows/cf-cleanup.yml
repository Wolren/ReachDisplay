name: CF Cleanup
on:
  workflow_dispatch:

jobs:
  dedupe:
    runs-on: ubuntu-latest
    steps:
      - name: Delete duplicate CurseForge files (keep newest per displayName)
        env:
          CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CF_PROJECT: 991296
        run: |
          for FID in 8618055 8617931; do
            CODE=$(curl -s -X DELETE -H "x-api-key: $CF_TOKEN" "https://api.curseforge.com/v1/mods/$CF_PROJECT/files/$FID" -o /tmp/del_$FID.json -w "%{http_code}")
            echo "DELETE $FID: HTTP $CODE body: $(head -c 200 /tmp/del_$FID.json)"
          done
          echo "--- files list after delete attempt ---"
          curl -s "https://www.curseforge.com/api/v1/mods/$CF_PROJECT/files?pageSize=10&sortBy=dateCreated&sortDescending=true" | jq -r '.data[] | select(.displayName | contains("3.1.1")) | "\(.id) \(.displayName)"'
