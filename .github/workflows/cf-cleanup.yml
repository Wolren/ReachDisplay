name: CF Cleanup
on:
  workflow_dispatch:

jobs:
  dedupe:
    runs-on: ubuntu-latest
    steps:
      - name: Delete duplicate CurseForge files (keep newest per displayName)
        env:
          CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CF_PROJECT: 991296
        run: |
          echo "--- RAW RESPONSE (first 600 chars) ---"
          curl -s -w "\nHTTP_CODE:%{http_code}" -H "x-api-key: $CF_TOKEN" "https://api.curseforge.com/v1/mods/$CF_PROJECT/files?pageSize=5" | tee /tmp/cf_raw.json | head -c 700
          echo ""
          FILES=$(cat /tmp/cf_raw.json)
          echo "--- ALL FILES (first 40) ---"
          echo "$FILES" | jq -r '.data[:40][] | "\(.id)\t\(.displayName)\t\(.fileDate)\t\(.releaseType)"'
          echo "--- 3.1.1 files ---"
          echo "$FILES" | jq -r '.data[] | select(.displayName | contains("3.1.1")) | "\(.id)\t\(.displayName)\t\(.fileDate)"'
