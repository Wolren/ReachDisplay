name: CF Cleanup
on:
  workflow_dispatch:

jobs:
  dedupe:
    runs-on: ubuntu-latest
    steps:
      - name: Delete duplicate CurseForge files (keep newest per displayName)
        env:
          CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CF_PROJECT: 991296
        run: |
          FILES=$(curl -s -H "x-api-key: $CF_TOKEN" "https://api.curseforge.com/v1/mods/$CF_PROJECT/files?pageSize=100")
          echo "--- ALL FILES (first 40) ---"
          echo "$FILES" | jq -r '.data[:40][] | "\(.id)\t\(.displayName)\t\(.fileDate)\t\(.releaseType)"'
          echo "--- 3.1.1 files ---"
          echo "$FILES" | jq -r '.data[] | select(.displayName | contains("3.1.1")) | "\(.id)\t\(.displayName)\t\(.fileDate)"'
