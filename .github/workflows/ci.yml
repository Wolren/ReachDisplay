name: CI
on:
  push:
    branches: [restructure]
  pull_request:
    branches: [restructure]
  workflow_dispatch:

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Gradle runs on 25: fabric-loom 1.18.2 refuses older JVMs at configuration
        # time. Each subproject still compiles with its own toolchain (17/21/25),
        # so the bytecode target of the jars does not change.
        include:
          - subproject: version-1_17_1_18
            jdk: '25'
          - subproject: version-1_19
            jdk: '25'
          - subproject: version-1_20_1
            jdk: '25'
          - subproject: version-1_21_1
            jdk: '25'
          - subproject: version-1_21_5
            jdk: '25'
          - subproject: version-1_21_11
            jdk: '25'
          - subproject: version-26_1_2
            jdk: '25'
          - subproject: version-26_2
            jdk: '25'
          - subproject: version-1_21_1-neoforge
            jdk: '25'
          - subproject: version-1_21_11-neoforge
            jdk: '25'
          - subproject: version-26_2-neoforge
            jdk: '25'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.jdk }}
          distribution: 'temurin'
      - name: Build ${{ matrix.subproject }} (Fabric)
        run: |
          chmod +x gradlew
          ./gradlew :${{ matrix.subproject }}:build --no-daemon
      - name: Build ${{ matrix.subproject }} (Quilt)
        run: |
          ./gradlew :${{ matrix.subproject }}:build -PuseQuilt=true --no-daemon

  forge-1201:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build Forge 1.20.1 (standalone project)
        run: |
          cd version-1_20_1-forge
          chmod +x gradlew
          ./gradlew build --no-daemon -Dorg.gradle.java.home=$JAVA_HOME
