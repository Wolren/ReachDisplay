name: CI
on:
  push:
    branches: [restructure]
  pull_request:
    branches: [restructure]
  workflow_dispatch:

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - subproject: version-1_17_1_18
            jdk: '21'
          - subproject: version-1_19
            jdk: '21'
          - subproject: version-1_20_1
            jdk: '21'
          - subproject: version-1_21_1
            jdk: '21'
          - subproject: version-1_21_5
            jdk: '21'
          - subproject: version-1_21_11
            jdk: '21'
          - subproject: version-26_1_2
            jdk: '25'
          - subproject: version-26_2
            jdk: '25'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.jdk }}
          distribution: 'temurin'
      - name: Build ${{ matrix.subproject }} (Fabric)
        run: |
          chmod +x gradlew
          ./gradlew :${{ matrix.subproject }}:build --no-daemon
      - name: Build ${{ matrix.subproject }} (Quilt)
        run: |
          ./gradlew :${{ matrix.subproject }}:build -PuseQuilt=true --no-daemon
