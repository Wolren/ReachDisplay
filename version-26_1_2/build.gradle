plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.17'
}

boolean useQuilt = project.hasProperty('useQuilt') ? project.useQuilt.toBoolean() : false

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // MC 26.1+ ships unobfuscated: no mappings line, no remap configurations.

    if (useQuilt) {
        implementation "org.quiltmc:quilt-loader:${project.quilt_loader_version}"
        implementation "org.quiltmc.quilted-fabric-api:quilted-fabric-api:${project.quilted_fabric_api_version}"
    } else {
        implementation "net.fabricmc:fabric-loader:${project.loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    }

    implementation "maven.modrinth:midnightlib:${project.midnightlib_version}"

    include implementation("io.github.llamalad7:mixinextras-fabric:${project.mixinextras_version}")
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}
