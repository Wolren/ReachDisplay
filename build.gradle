buildscript {
    repositories {
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.modrinth.minotaur:Minotaur:2.9.0'
    }
}

plugins {
    id 'idea'
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'
    apply plugin: 'idea'
    apply plugin: 'com.modrinth.minotaur'

    version = project.mod_version
    group = project.maven_group
    base.archivesName = project.archives_base_name

    repositories {
        mavenCentral()
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.quiltmc.org/repository/release/" }
        maven { url = "https://api.modrinth.com/maven" }
    }

    processResources {
        inputs.property "version", project.version
        inputs.property "minecraft_version", project.minecraft_version
        inputs.property "loader_version", project.loader_version
        filteringCharset "UTF-8"
        filesMatching("fabric.mod.json") {
            expand "version": project.version,
                    "minecraft_version": project.minecraft_version,
                    "loader_version": project.loader_version
        }
        filesMatching("quilt.mod.json") {
            expand "version": project.version,
                    "minecraft_version": project.minecraft_version,
                    "loader_version": project.loader_version
        }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = "UTF-8"
    }

    java { withSourcesJar() }

    jar {
        from("${rootProject.projectDir}/LICENSE") {
            rename { "${it}_${archiveBaseName.get()}" }
        }
    }

    publishing {
        publications { mavenJava(MavenPublication) { from components.java } }
        repositories {}
    }

    afterEvaluate {
        modrinth {
            token = System.getenv("MODRINTH_TOKEN")
            projectId = "reach-display"
            versionNumber = project.mod_version
            versionName = project.mod_version
            // Unobfuscated MC (26.1+) has no remapJar task — the plain jar is the release artifact.
            uploadFile = tasks.findByName("remapJar") ?: tasks.jar
            // Per-subproject game version list (gradle.properties: game_versions=a,b,c)
            gameVersions = project.hasProperty("game_versions") ? project.game_versions.split(",") : [project.minecraft_version]
            loaders = ["fabric"]
            changelog = rootProject.file("CHANGELOG.md").text
            dependencies {
                required.project "fabric-api"
                required.project "midnightlib"
                optional.project "modmenu"
            }
        }
    }
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}
